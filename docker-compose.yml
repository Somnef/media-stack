services:
  init-data:
    image: alpine:latest
    container_name: init-data
    volumes:
      - ${DATA}:/data
    command: >
      sh -c "
      for d in movies tv anime music books; do
        mkdir -p /data/torrents/$$d /data/media/$$d;
      done &&
      chown ${PUID}:${PGID} /data /data/torrents /data/media /data/torrents/* /data/media/* &&
      echo 'data structure verified'
      "
    restart: "no"
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    depends_on:
      init-data:
        condition: service_completed_successfully
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - FIREWALL_VPN_INPUT_PORTS=${VPN_PORT}
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24,172.16.0.0/12
      - TZ=${TZ}
    ports:
      - 8080:8080          # qbittorrent
      - 9696:9696          # prowlarr
      - 7878:7878          # radarr
      - 8989:8989          # sonarr
      - 6767:6767          # bazarr
      - 8686:8686          # lidarr
      - ${VPN_PORT}:${VPN_PORT}
      - ${VPN_PORT}:${VPN_PORT}/udp
    volumes:
      - ${CONFIG}/gluetun:/gluetun
    restart: unless-stopped
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=${VPN_PORT}
    volumes:
      - ${CONFIG}/qbittorrent:/config
      - ${DATA}:/data
    restart: unless-stopped
  qbit-manage:
    image: ghcr.io/stuffanthings/qbit_manage:latest
    container_name: qbit-manage
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - QBT_RUN=false
      - QBT_SCHEDULE=30
      - QBT_CONFIG=/config/config.yml
      - QBIT_USER=${QBIT_USER}
      - QBIT_PASS=${QBIT_PASS}
    volumes:
      - ${CONFIG}/qbit-manage:/config
    restart: on-failure:2
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/prowlarr:/config
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/radarr:/config
      - ${DATA}:/data
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/sonarr:/config
      - ${DATA}:/data
    restart: unless-stopped
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    restart: unless-stopped
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/bazarr:/config
      - ${DATA}:/data
    restart: unless-stopped
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    depends_on:
      init-data:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
    volumes:
      - ${CONFIG}/plex:/config
      - ${DATA}/media:/data/media:ro
    restart: unless-stopped
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    depends_on:
      init-data:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/jellyfin:/config
      - ${DATA}/media:/data/media:ro
    ports:
      - 8096:8096
    restart: unless-stopped
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/jellyseerr:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/lidarr:/config
      - ${DATA}:/data
    restart: unless-stopped
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    depends_on:
      init-data:
        condition: service_completed_successfully
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_MUSICFOLDER=/data/media/music
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/navidrome:/data
      - ${DATA}/media/music:/data/media/music:ro
    ports:
      - 4533:4533
    restart: unless-stopped
  dnsmasq:
    image: jpillora/dnsmasq:latest
    container_name: dnsmasq
    volumes:
      - ${CONFIG}/dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf
    ports:
      - 53:53/udp
      - 53:53/tcp
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    volumes:
      - ${CONFIG}/npm/data:/data
      - ${CONFIG}/npm/letsencrypt:/etc/letsencrypt
    ports:
      - 80:80
      - 443:443
      - 81:81
    restart: unless-stopped
