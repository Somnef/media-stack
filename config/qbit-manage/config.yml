commands:
  dry_run: false
  tag_update: true
  share_limits: true
  recheck: false
  cat_update: false
  rem_unregistered: false
  tag_tracker_error: false
  rem_orphaned: true
  tag_nohardlinks: true
  skip_cleanup: false
  skip_qb_version_check: false

qbt:
  host: localhost:8080
  user: !ENV QBIT_USER
  pass: !ENV QBIT_PASS

directory:
  root_dir: /data/torrents
  orphaned_dir: /data/torrents/orphaned_data

  torrents_dir:
tracker:
  tr4ker.net:
    tag: private
  myanonamouse:
    tag: private
  other:
    tag: public

share_limits:
  public:
    priority: 1
    include_all_tags:
    - public
    max_ratio: 0
    max_seeding_time: 0
    cleanup: true
    share_limit_action: Default
  private:
    priority: 2
    include_all_tags:
    - private
    max_ratio: -1
    max_seeding_time: -1
    cleanup: false
    share_limit_action: Default

settings:
  force_auto_tmm: false
  tracker_error_tag: issue
  nohardlinks_tag: noHL
  stalled_tag: stalledDL
  private_tag:
  share_limits_tag: ~share_limit
  cat_filter_completed: true
  share_limits_filter_completed: true
  disable_qbt_default_share_limits: true
  tag_stalled_torrents: true

  share_limits_min_seeding_time_tag: MinSeedTimeNotReached
  share_limits_min_num_seeds_tag: MinSeedsNotMet
  share_limits_last_active_tag: LastActiveLimitNotReached
  tag_nohardlinks_filter_completed: true
  rem_unregistered_filter_completed: false
  cat_update_all: true
  force_auto_tmm_ignore_tags: []
  rem_unregistered_ignore_list: []
  rem_unregistered_grace_minutes: 10
  rem_unregistered_max_torrents: 10

nohardlinks:
  radarr:
  tv-sonarr:
  anime-sonarr:
  lidarr:

recyclebin:
  enabled: false
  empty_after_x_days:
  save_torrents: false
  split_by_category: false
webhooks:
  error:
  run_start:
  run_end:
  function:
    recheck:
    cat_update:
    tag_update:
    rem_unregistered:
    tag_tracker_error:
    rem_orphaned:
    tag_nohardlinks:
    share_limits:
    cleanup_dirs:
orphaned:
  empty_after_x_days: 14
  exclude_patterns:
  max_orphaned_files_to_delete: 50
  min_file_age_minutes: 60
